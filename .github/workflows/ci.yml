# Every PR, push to master, tag and manual run gets the checks and the full
# Playwright run (desktop + phone). The release-flip workflow chains on
# `name: CI`: keep it.
name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Only a newer push to the same PR cancels a run. Master, tag and manual runs
# get a group of their own (the run id), so none of them cancels another:
# a tag's e2e must finish even when master moves on.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Don't give any job GH_TOKEN/GITHUB_TOKEN in its env until the unit tests'
# stray real-gh call is fixed (a background `gh auth status` that outlives its
# test's fake gh): with a token it would reach GitHub.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # A wall-clock limit per test step, the net for a hung test: no Vitest
      # timeout can end a microtask loop (e.g. a waitFor callback that writes
      # the DOM wakes its own MutationObserver, so timers never fire). The
      # step takes 9-13 min (Nov 2026) and grows: keep headroom.
      # Test traces (docs/test-profiling.md) go to a directory uploaded below.
      - run: pnpm test
        timeout-minutes: 25
        env:
          CRB_TEST_TRACE_ROOT: ${{ runner.temp }}/test-traces
      # The pack smoke test as promote runs it, on a tarball packed first
      # (pnpm test:pack, in pnpm verify, packs its own).
      - name: Pack smoke test, on a packed tarball
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          node scripts/pack-smoke.mjs "$RUNNER_TEMP"/pack/carbonless-review-*.tgz
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-traces-unit
          path: ${{ runner.temp }}/test-traces/
          retention-days: 14

  # The agent's spawn and kill differ on Windows (npm .cmd shims, no process
  # groups), and so do the update helper's wait, install and relaunch; the
  # rest of the suite assumes POSIX. vitest runs unqueued:
  # scripts/queue.mjs takes its lock with flock.
  windows-agent:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run src/server/agent/acp.test.ts src/server/agent/runner.test.ts src/server/update/updateHelper.test.ts src/server/update/install.test.ts

  # Playwright in parallel shards (about 15 min each at ~830 tests on a
  # 2-core runner; one runner took 35+ min and hit its limit). Each uploads
  # its own artifacts; `e2e` below merges the traces and is the one result.
  e2e-shard:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Hang safety nets, sized for one shard.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The shard count (4) is also in the job name, `--shard=…/4` and
        # the merged run.json's "shards" in `e2e`: change them together.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Queued (scripts/queue.mjs): the lock is free on a runner, and a run
      # holding it gets a Playwright worker per core.
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/4
        timeout-minutes: 20
        env:
          CRB_TEST_TRACE_ROOT: ${{ runner.temp }}/test-traces
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-traces-e2e-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-traces/
          retention-days: 14
      # A shard's HTML report covers its own tests, failures included, so
      # the reports aren't merged.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # One result for the whole e2e run, and the shards' traces as one run
  # (artifact `test-traces-e2e`, docs/test-profiling.md).
  e2e:
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: test-traces-e2e-*
          path: ${{ runner.temp }}/shards
      # Every shard's trace files in one run directory, each name prefixed
      # with its shard so none collide.
      - run: |
          run="$RUNNER_TEMP/test-traces/e2e-ci-$GITHUB_RUN_ID"
          mkdir -p "$run"
          # "shards": the matrix's count (see e2e-shard).
          printf '{"id":"e2e-ci-%s","kind":"e2e","shards":4}\n' "$GITHUB_RUN_ID" > "$run/run.json"
          for shard in "$RUNNER_TEMP"/shards/test-traces-e2e-*; do
            [ -d "$shard" ] || continue
            n="${shard##*-}"
            find "$shard" -type f \( -name '*.jsonl' -o -name '*.jsonl.gz' \) |
              while read -r f; do cp "$f" "$run/s$n-$(basename "$f")"; done
          done
          ls "$run" | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: test-traces-e2e
          path: ${{ runner.temp }}/test-traces/
          retention-days: 14
      - if: needs.e2e-shard.result != 'success'
        run: |
          echo "e2e shards: ${{ needs.e2e-shard.result }}"
          exit 1
