# Cheap checks on every PR and push to master; the full Playwright run
# (desktop + phone) only on version tags and on demand, to save Actions
# minutes. The release-flip workflow chains on `name: CI`: keep it.
name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Only a newer push to the same PR cancels a run. Master, tag and manual runs
# get a group of their own (the run id), so none of them cancels another:
# a tag's e2e must finish even when master moves on.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Don't give any job GH_TOKEN/GITHUB_TOKEN in its env until the unit tests'
# stray real-gh call is fixed (a background `gh auth status` that outlives its
# test's fake gh): with a token it would reach GitHub.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:pack

  e2e:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Queued (scripts/queue.mjs): the lock is free on a runner, and a run
      # holding it gets a Playwright worker per core.
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
