# Publishes a tried RC as a release: the RC tag's commit, checked in full
# (e2e too), published again as X.Y.Z on npm's `latest`, tagged vX.Y.Z; then
# a PR "next: <X.Y.Z bumped>" with docs/changelog.md for the owner to merge.
# Started by `pnpm release promote` on the owner's word. Two jobs: `check`
# (the RC built and tested in full, packed) runs at once; `publish` (npm, the
# tag, the next PR) runs in the GitHub environment `npm-release`, whose
# required reviewer is the owner: nothing is published until they approve the
# run, whoever started it. docs/releasing.md.
name: Promote

on:
  workflow_dispatch:
    inputs:
      rc:
        description: RC tag to release (vX.Y.Z-rc.N; empty = the newest)
        required: false
        default: ""
      next:
        description: The next release after it
        type: choice
        options: [minor, patch, major]
        default: minor

permissions:
  contents: read

concurrency:
  # Its own group: a publish-rc queued meanwhile can't cancel it, nor it a
  # pending publish-rc. Running at the same time is safe: publish-rc makes no
  # RC of a released version, and both end by moving rc up to latest when
  # it is behind, so whichever finishes last leaves rc on the newer.
  group: promote
  cancel-in-progress: false

defaults:
  run:
    shell: bash # -eo pipefail: `cmd | tee` fails when cmd does

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Inputs reach the shell as variables, never pasted into scripts.
      RC_INPUT: ${{ inputs.rc }}
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
      sha: ${{ steps.rc.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0 # every tag
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Plan
        id: plan
        run: pnpm exec tsx scripts/release.ts ci:promote-plan "$RC_INPUT" | tee -a "$GITHUB_OUTPUT"
      - name: Check out the RC
        id: rc
        run: |
          echo "RC_DIR=$RUNNER_TEMP/rc" >>"$GITHUB_ENV"
          RC_DIR="$RUNNER_TEMP/rc"
          git worktree add --detach "$RC_DIR" "refs/tags/${{ steps.plan.outputs.tag }}"
          sha="$(git rev-parse "refs/tags/${{ steps.plan.outputs.tag }}^{commit}")"
          echo "RC_SHA=$sha" >>"$GITHUB_ENV"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
      - name: Install the RC
        working-directory: ${{ runner.temp }}/rc
        run: pnpm install --frozen-lockfile
      - name: Set the version (the tree stays clean)
        # master's release.ts: the RC's commit may predate it.
        run: pnpm exec tsx scripts/release.ts ci:set-version "${{ steps.plan.outputs.release }}" "$RC_DIR"
      - name: Checks
        working-directory: ${{ runner.temp }}/rc
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Playwright
        working-directory: ${{ runner.temp }}/rc
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Pack smoke test
        working-directory: ${{ runner.temp }}/rc
        run: pnpm test:pack
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ${{ runner.temp }}/rc/playwright-report/
            ${{ runner.temp }}/rc/test-results/
          retention-days: 14
      - name: Pack
        working-directory: ${{ runner.temp }}/rc
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          tgz="$(ls "$RUNNER_TEMP"/pack/carbonless-review-*.tgz)"
          tar -xzOf "$tgz" package/dist/build-info.json | tee "$RUNNER_TEMP/build-info.json"
          node -e '
            const b = require(process.argv[1]);
            if (b.version !== process.argv[2] || b.commit !== process.argv[3]) {
              console.error(`build-info is ${b.version} ${b.commit}`);
              process.exit(1);
            }' "$RUNNER_TEMP/build-info.json" "${{ steps.plan.outputs.release }}" "$RC_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: ${{ runner.temp }}/pack/carbonless-review-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The owner is this environment's required reviewer: the run waits here
    # for their approval. NPM_TOKEN may be an environment secret of it.
    environment: npm-release
    permissions:
      contents: write # the vX.Y.Z tag and the next/* branch
      pull-requests: write # the "next" PR
    env:
      NEXT_INPUT: ${{ inputs.next }}
      TAG: ${{ needs.check.outputs.tag }}
      RELEASE: ${{ needs.check.outputs.release }}
      RC_SHA: ${{ needs.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0 # every tag, and history for the changelog
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: release-tarball
          path: ${{ runner.temp }}/pack
      - name: The tarball the check job tested
        run: |
          tgz="$(ls "$RUNNER_TEMP"/pack/carbonless-review-*.tgz)"
          echo "TGZ=$tgz" >>"$GITHUB_ENV"
          tar -xzOf "$tgz" package/dist/build-info.json >"$RUNNER_TEMP/build-info.json"
          node -e '
            const b = require(process.argv[1]);
            if (b.version !== process.argv[2] || b.commit !== process.argv[3]) {
              console.error(`build-info is ${b.version} ${b.commit}`);
              process.exit(1);
            }' "$RUNNER_TEMP/build-info.json" "$RELEASE" "$RC_SHA"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish to npm (latest)
        run: npm publish "$TGZ" --tag latest --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Is rc behind latest?
        # So main, which follows rc, never runs behind latest. Asked after
        # publishing, not planned before: a publish-rc may have run meanwhile.
        id: fixup
        # The release as the floor: right after publishing, the read may still
        # be stale (even a 404 on the first publish).
        run: pnpm exec tsx scripts/release.ts ci:rc-fixup "$RELEASE" | tee -a "$GITHUB_OUTPUT"
      - name: Move rc to latest
        if: steps.fixup.outputs.move_rc_to != ''
        run: npm dist-tag add "carbonless-review@${{ steps.fixup.outputs.move_rc_to }}" rc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Tag
        env:
          TOKEN: ${{ github.token }}
        run: |
          git tag "v$RELEASE" "$RC_SHA"
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" git push origin "refs/tags/v$RELEASE"
      - name: Next version and changelog PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          next="$(pnpm exec tsx scripts/release.ts ci:bump "$RELEASE" "$NEXT_INPUT" | sed -n 's/^next=//p')"
          branch="next/$next"
          git switch -c "$branch"
          pnpm exec tsx scripts/release.ts ci:write-version "$next"
          pnpm exec tsx scripts/release.ts ci:changelog "$RELEASE" "$RC_SHA"
          git add package.json docs/changelog.md
          git commit -m "next: $next" -m "Released $RELEASE ($TAG); merges to master now publish $next-rc.N."
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" git push --force origin "$branch"
          open="$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // ""')"
          if [[ -z "$open" ]]; then
            gh pr create --base master --head "$branch" --title "next: $next" \
              --body "Released **$RELEASE** from $TAG (npm \`latest\`). This sets master's next release to $next and adds $RELEASE to docs/changelog.md."
          fi
          {
            echo "Released carbonless-review@$RELEASE on \`latest\` from $TAG."
            echo "Next: $next (PR from $branch)."
          } >>"$GITHUB_STEP_SUMMARY"
