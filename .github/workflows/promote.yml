# Checks a tried RC for release: the RC tag's commit (it must be on master),
# checked in full (e2e too), set to version X.Y.Z (and gitHead), packed. The
# tarball and a manifest (version, RC tag, commit, sha256, integrity) are the
# run's artifact `release`. Nothing is published here: the owner publishes it
# with npm's two-factor OTP (`pnpm release publish`), which then starts
# release-finish (tag, rc, changelog, the next PR). No npm token, no write
# permissions. Started by `pnpm release promote` on the owner's word.
# docs/releasing.md.
name: Promote
run-name: Promote ${{ inputs.rc || 'the newest RC' }} (next ${{ inputs.next }})

on:
  workflow_dispatch:
    inputs:
      rc:
        description: RC tag to release (vX.Y.Z-rc.N; empty = the newest)
        required: false
        default: ""
      next:
        description: The next release after it
        type: choice
        options: [minor, patch, major]
        default: minor

permissions:
  contents: read

concurrency:
  # Its own group: a publish-rc queued meanwhile can't cancel it, nor it a
  # pending publish-rc.
  group: promote
  cancel-in-progress: false

defaults:
  run:
    shell: bash # -eo pipefail: `cmd | tee` fails when cmd does


jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Inputs reach the shell as variables, never pasted into scripts.
      RC_INPUT: ${{ inputs.rc }}
      NEXT_INPUT: ${{ inputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0 # every tag; the RC must be in master's history
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Plan
        id: plan
        run: pnpm exec tsx scripts/release.ts ci:promote-plan "$RC_INPUT" | tee -a "$GITHUB_OUTPUT"
      - name: Check out the RC
        run: |
          echo "RC_DIR=$RUNNER_TEMP/rc" >>"$GITHUB_ENV"
          RC_DIR="$RUNNER_TEMP/rc"
          git worktree add --detach "$RC_DIR" "refs/tags/${{ steps.plan.outputs.tag }}"
          echo "RC_SHA=$(git rev-parse "refs/tags/${{ steps.plan.outputs.tag }}^{commit}")" >>"$GITHUB_ENV"
      - name: Install the RC
        working-directory: ${{ runner.temp }}/rc
        run: pnpm install --frozen-lockfile
      - name: Set the version and gitHead (the tree stays clean)
        # master's release.ts: the RC's commit may predate it.
        run: pnpm exec tsx scripts/release.ts ci:set-version "${{ steps.plan.outputs.release }}" "$RC_DIR"
      - name: Checks
        working-directory: ${{ runner.temp }}/rc
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Playwright
        working-directory: ${{ runner.temp }}/rc
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Pack smoke test
        working-directory: ${{ runner.temp }}/rc
        run: pnpm test:pack
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ${{ runner.temp }}/rc/playwright-report/
            ${{ runner.temp }}/rc/test-results/
          retention-days: 14
      - name: Pack, and the manifest
        env:
          RELEASE: ${{ steps.plan.outputs.release }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          (cd "$RC_DIR" && pnpm pack --pack-destination "$out")
          tgz="$out/carbonless-review-$RELEASE.tgz"
          tar -xzOf "$tgz" package/dist/build-info.json >"$RUNNER_TEMP/build-info.json"
          node -e '
            const b = require(process.argv[1]);
            if (b.version !== process.argv[2] || b.commit !== process.argv[3]) {
              console.error(`build-info is ${b.version} ${b.commit}`);
              process.exit(1);
            }' "$RUNNER_TEMP/build-info.json" "$RELEASE" "$RC_SHA"
          pnpm exec tsx scripts/release.ts ci:manifest "$tgz" "$RELEASE" "$TAG" "$RC_SHA" "$NEXT_INPUT" >"$out/manifest.json"
          {
            echo "### Ready to publish carbonless-review@$RELEASE from $TAG"
            echo
            echo "| | |"
            echo "|---|---|"
            node -e '
              const m = require(process.argv[1]);
              for (const k of ["version", "tag", "sha", "sha256", "integrity", "next", "tarball"])
                console.log(`| ${k} | \`${m[k]}\` |`);' "$out/manifest.json"
            echo
            echo "Nothing is published yet. The owner publishes it with npm's OTP:"
            echo "\`pnpm release publish $GITHUB_RUN_ID\`, which then starts release-finish."
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            ${{ runner.temp }}/release/*.tgz
            ${{ runner.temp }}/release/manifest.json
          if-no-files-found: error
          retention-days: 30
