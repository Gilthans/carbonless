# CI's flake rate, weekly (docs/ci-flakes.md): `pnpm ci-flakes` over the
# last 7 and 30 days into the job summary. Red when the 7-day rate is over
# 2% (the owner's target: CI at least 98% green when there's no bug).
# It runs no tests and installs nothing (scripts/ci-flakes.mjs has no
# dependencies): the only job with a token, which only reads Actions.
name: Flake report

on:
  schedule:
    # Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Last 30 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node scripts/ci-flakes.mjs --since 30d --markdown | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Last 7 days (red over 2%)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node scripts/ci-flakes.mjs --since 7d --markdown --fail-over 2 | tee -a "$GITHUB_STEP_SUMMARY"
