# CI's flake rate, weekly (docs/ci-flakes.md): `pnpm ci-flakes` over the
# last 7 and 30 days, one collection for both, into the job summary. Red
# when the 7-day rate is over 2% (the owner's target: CI at least 98% green
# when there's no bug), or when the report can't read what it needs.
# It runs no tests and installs nothing (scripts/ci-flakes.mjs has no
# dependencies): the only job with a token, which only reads Actions. The
# token allows 1,000 API calls an hour; the step prints what it used.
# Actions pinned by SHA, as in the release workflows.
name: Flake report

on:
  schedule:
    # Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Last 7 and 30 days (red over 2% in 7)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node scripts/ci-flakes.mjs --since 7d,30d --markdown --fail-over 2 | tee -a "$GITHUB_STEP_SUMMARY"
