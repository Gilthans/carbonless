# Every push to master whose CI passed becomes an RC: X.Y.Z-rc.N on npm's
# `rc` dist-tag and the git tag vX.Y.Z-rc.N, where X.Y.Z is master's
# package.json version (the next release). The version is set only in this
# runner's checkout, never committed. docs/releasing.md.
name: Publish RC

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: write # the vX.Y.Z-rc.N tag

concurrency:
  # One RC publish at a time, so two never pick the same N. Its own group:
  # a pending run here never cancels a pending promote, or the other way.
  group: publish-rc
  cancel-in-progress: false

defaults:
  run:
    shell: bash # -eo pipefail: `cmd | tee` fails when cmd does

jobs:
  publish:
    # A push to master of this repository (not a PR whose branch is called
    # master, not a fork), CI green.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # every tag, for the RC number
          # The write token stays out of .git/config while dependencies'
          # code runs; only the steps that talk to origin get it.
          persist-credentials: false
      - name: Still master's tip?
        id: tip
        # CI runs can finish out of order: only the newest push is published
        # (it holds the older ones), so `rc` never moves back.
        env:
          TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          tip="$(GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" git ls-remote origin refs/heads/master | cut -f1)"
          if [[ "$tip" == "$SHA" ]]; then
            echo "publish=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::master moved on to $tip: skipping $SHA"
            echo "publish=false" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.tip.outputs.publish == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - if: steps.tip.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - if: steps.tip.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      - name: Version
        id: version
        if: steps.tip.outputs.publish == 'true'
        run: pnpm exec tsx scripts/release.ts ci:rc-version | tee -a "$GITHUB_OUTPUT"
      - name: Released already?
        if: steps.version.outputs.publish == 'false'
        env:
          REASON: ${{ steps.version.outputs.blocked }}
        run: |
          echo "::warning::$REASON"
          echo "No RC: $REASON" >>"$GITHUB_STEP_SUMMARY"
      - name: Set the version (the tree stays clean)
        if: steps.version.outputs.publish == 'true'
        run: pnpm exec tsx scripts/release.ts ci:set-version "${{ steps.version.outputs.version }}"
      - name: Pack
        if: steps.version.outputs.publish == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          tgz="$(ls "$RUNNER_TEMP"/pack/carbonless-review-*.tgz)"
          echo "TGZ=$tgz" >>"$GITHUB_ENV"
          # The build must say what it is: this version, this commit, not -dirty.
          tar -xzOf "$tgz" package/dist/build-info.json | tee "$RUNNER_TEMP/build-info.json"
          node -e '
            const b = require(process.argv[1]);
            if (b.version !== process.argv[2] || b.commit !== process.argv[3]) {
              console.error(`build-info is ${b.version} ${b.commit}`);
              process.exit(1);
            }' "$RUNNER_TEMP/build-info.json" "${{ steps.version.outputs.version }}" "$SHA"
      - name: Only an X.Y.Z-rc.N, only to rc
        # A guard against our own bugs, before any token is in the step.
        if: steps.version.outputs.publish == 'true' && steps.version.outputs.first_publish == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm exec tsx scripts/release.ts ci:check-publish rc "$VERSION"
          [[ "$(basename "$TGZ")" == "carbonless-review-$VERSION.tgz" ]] || {
            echo "::error::$TGZ is not carbonless-review-$VERSION.tgz"
            exit 1
          }
      - name: Publish to npm (rc)
        # Before the package's first publish, npm would make whatever is
        # published first `latest`: the first version must be a release
        # (pnpm release promote), so this only tags the RC in git.
        if: steps.version.outputs.publish == 'true' && steps.version.outputs.first_publish == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$TGZ" --tag rc --access public
      - name: Tag
        if: steps.version.outputs.publish == 'true'
        env:
          TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          git tag "$tag" "$SHA"
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" git push origin "refs/tags/$tag"
          if [[ "${{ steps.version.outputs.first_publish }}" == true ]]; then
            echo "::warning::carbonless-review is not on npm yet: $tag is tagged, not published. Its first version must be a release: pnpm release promote $tag"
            echo "First publish: $tag is tagged only. Run \`pnpm release promote $tag\`." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "Published carbonless-review@${{ steps.version.outputs.version }} on \`rc\`, tagged $tag." >>"$GITHUB_STEP_SUMMARY"
          fi
      - name: Is rc behind latest?
        # A promote may have published a release meanwhile (it runs in its
        # own group): whichever of the two finishes last puts rc on the newer.
        id: fixup
        if: steps.version.outputs.first_publish == 'false'
        # This run's RC, if it published one: a stale read can't move rc below it.
        run: |
          published=""
          if [[ "${{ steps.version.outputs.publish }}" == true ]]; then
            published="${{ steps.version.outputs.version }}"
          fi
          pnpm exec tsx scripts/release.ts ci:rc-fixup ${published:+"$published"} | tee -a "$GITHUB_OUTPUT"
      - name: Move rc to latest
        if: steps.fixup.outputs.move_rc_to != ''
        run: npm dist-tag add "carbonless-review@${{ steps.fixup.outputs.move_rc_to }}" rc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
